# Fly.io config for the StockSaathi backup API.
# Deployed from repo root via: flyctl deploy --config api-backup/fly.toml
#
# App name: placeholder — user must change with `flyctl apps create stocksaathi-backup`
# and then `flyctl deploy --config api-backup/fly.toml` from the app/ directory.

app = "stocksaathi-backup"
primary_region = "bom"  # Mumbai — matches the target user base

[build]
  dockerfile = "api-backup/Dockerfile"

[env]
  RUNTIME = "fly"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false   # stay warm so failover is instant
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/__up"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
